version: '3'

vars:
  GOFLAGS: '-trimpath'

tasks:
  default:
    cmds:
      - task: check

  build:
    desc: Build the binary
    cmds:
      - go build {{.GOFLAGS}} -o pinky .

  test:
    desc: Run the test suite
    cmds:
      - go test ./...

  integration:build:
    desc: Build pinky and the fakegopls LSP fixture
    cmds:
      - go build {{.GOFLAGS}} -o pinky .
      - go build {{.GOFLAGS}} -o fakegopls ./tests/integration/cmd/fakegopls

  integration:
    desc: Run scenario-based LSP integration tests (Path C)
    deps: [integration:build]
    cmds:
      # PINKY_TEST=1 activates the seam that bypasses the tmux
      # requirement. The dep task drops pinky + fakegopls at
      # the repo root, which is the default path each test resolves.
      - cmd: go test -tags=integration -count=1 -timeout=60s ./tests/integration/...
        env:
          PINKY_TEST: "1"

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Run vet + tests
    cmds:
      - task: vet
      - task: test

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy